<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A 4-out 1-in floor. The ball is passed from 1 at the right slot out to 2 on the right wing. 1 then cuts across the top and screens away on x3, the defender of 3 at the left slot, drawn as a bar between the end of 1's cut and x3, labeled screen away just to the right of the bar. 3 comes up off the screen, over the top of the key and across to the right slot, the spot 1 left, labeled fill. The big, 5, lifts from the left block toward the left elbow, and 4 is in the left corner. Nobody was told which play this is; each player is following a rule about what to do after the ball moves." class="hd-court-svg">
