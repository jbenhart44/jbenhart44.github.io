<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A pick-and-roll from the right slot. The screener's defender has dropped back to the edge of the paint, level with where the roll will arrive, and back-pedals as the handler comes off the screen. The handler's defender chases over the top of the screen. The handler dribbles into the middle and has a pull-up jumper in front of the dropped big; the roller is bracketed between the two defenders. Three shooters are spaced in the corners and the left wing." class="hd-court-svg">
