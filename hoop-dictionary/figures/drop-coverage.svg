<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A pick-and-roll from the right slot. The screener stands beside the handler's defender, with the screen bar between them, touching neither. The handler dribbles over the top of the screen, marked over the top, turns the corner and dribbles down into the free-throw circle, where the pull-up jumper is marked. The handler's defender takes a short arrow up past the top of the screen bar, chasing over it, and stops below the handler's dribble. The screener rolls and stops at the top of the paint, level with the screener's defender, who starts there and back-pedals toward the rim along an arrow labeled drop, so the roller and the handler are both in front of him. Three shooters are spaced in the two corners and on the left wing, each with a defender." class="hd-court-svg">
