<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 346.0" width="516.0" role="img" aria-label="The offense has 1 at the top with the ball, 2 on the right wing, 3 on the left wing, 4 in the right corner and 5 in the left short corner. The five defenders start in a 1-3-1, labeled starts as a 1-3-1: x1 at the point above the free-throw circle, x2 and x3 level with the free-throw line out beyond each side of the lane with x4 between them just below the line, and x5 in the lane above the rim. A dashed pass goes from 1 to 2 on the right wing. Five teal arrows show the defenders sliding while the pass is in the air: x1 drops toward the right elbow and x3 steps down and out below 2, and those two end high, while x2 drops into the left side of the lane, x4 drops to above and right of the rim and x5 slides toward the right baseline, and those three end low, labeled ends two up, three back. The shape shown is one example; the scheme's point is that the offense does not know which shape it will see after the next pass." class="hd-court-svg">
  <title>The amoeba: a zone that starts in one shape and moves into another as the ball moves</title>
  <defs><marker id="hd-arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--hd-offense, #C97400)"/></marker><marker id="hd-arrow-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--hd-defense, #209CAD)"/></marker></defs>
