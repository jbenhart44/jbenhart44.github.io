  <line x1="225.5" y1="246.5" x2="250.5" y2="221.5" stroke="var(--hd-defense, #209CAD)" stroke-width="2.6" stroke-linecap="round"/>
  <text x="221.0" y="238.5" text-anchor="end" font-size="13.0" fill="var(--hd-defense-ink, #14717F)">x5</text>
