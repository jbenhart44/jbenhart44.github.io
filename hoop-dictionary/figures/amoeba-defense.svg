<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="Five defenders start in a 1-3-1: one at the point above the free-throw line, three across the line, one near the rim. The ball is passed from the top to the right wing, and the arrows show the defenders sliding into a different shape, two up and three back, as the pass is in the air. The shape shown is one example; the scheme's point is that the offense does not know which shape it will see after the next pass." class="hd-court-svg">
  <title>The amoeba: a zone that starts in one shape and moves into another as the ball moves</title>
