<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 376.0" width="516.0" role="img" aria-label="Three attackers against two defenders in a line down the middle. 1 dribbles down the middle toward the free-throw line, with 2 on the left wing and 3 on the right wing. The front defender, at the free-throw line, steps up to the ball. 1 passes to 3 on the right wing; the back defender, in front of the rim, runs out to 3, and the front defender drops toward the rim on the left of where the back defender stood." class="hd-court-svg">
