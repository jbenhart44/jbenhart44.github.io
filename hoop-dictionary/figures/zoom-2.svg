<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="The shooter has the ball at the right wing, right beside the ball-handler, who is labeled handoff because he has just given it to him. The shooter dribbles downhill toward the rim. His defender, labeled trailing, is behind him, above the wing on the side away from the drive. The ball-handler steps up and out beyond the arc toward the slot, and his defender is below him, off the shooter's path. The big who set the pin-down rolls from outside the lane into the lane toward the rim, and the big's defender stands between the roll and the drive. Two attackers stay on the left wing and in the left corner, each with a defender." class="hd-court-svg">
