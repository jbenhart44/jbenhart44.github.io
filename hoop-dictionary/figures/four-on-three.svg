<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="Half court. 1 has the ball at the right slot. Two defenders trap him, x1 above him and to his left and x5 below him and to his right, labeled two on the ball. The other four attackers are spread out: 5 at the free-throw line, 2 in the right corner, 3 in the left corner and 4 at the left dunker spot. Only three defenders are left for them: x2 a few feet outside the right lane line, x3 just outside the left lane line and x4 just above the rim and to its left, a triangle inside the arc, labeled three guard four inside the triangle, just above x4. A dashed pass goes from 1 to 5 at the free-throw line, its head at the edge of 5's circle." class="hd-court-svg">
