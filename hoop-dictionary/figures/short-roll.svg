<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="Half court. The ball-handler, 1, has the ball above the arc on the right side, trapped by two defenders, x1 above him on his left and x5 below him on his right, labeled trap. A dashed pass goes from 1 to the screener, 5, who has stopped his roll on the free-throw line, labeled short roll: 4 on 3. From 5, dashed passes go to 3 in the left corner and to 4 at the left dunker spot, and a dribble goes down the lane toward the rim. The three defenders who did not trap stay back: x3 between 3 and the free-throw line, x4 in the lane just left of the rim, and x2 inside the arc on the right, between 2 in the right corner and the lane." class="hd-court-svg">
