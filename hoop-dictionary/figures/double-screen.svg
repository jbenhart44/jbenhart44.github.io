<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="A shooter, 2, starts low on the left side of the lane with his defender, x2, above him and to his right, inside the lane. Two screeners, 4 and 5, stand side by side above the left block, shoulder to shoulder, each with a bar just below him facing the baseline, making a wall twice as wide as one screen, labeled the wall. Their defenders, x4 and x5, are above them. The shooter runs out to his left under the wall, then turns and runs up around the outside end of the wall to the left wing, where the dashed pass from 1 at the right slot meets him, labeled catch. 1's defender, x1, is below him, and 3 is in the right corner with his defender, x3, above him." class="hd-court-svg">
