<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393.0 679.0" width="393.0" role="img" aria-label="Full court. The ball has been trapped against the right sideline in the back court by two defenders who converged from their own areas. The three defenders behind the trap are not matched to attackers: one has slid toward the middle of the floor to take the pass into the centre, one has dropped ahead of the ball on the right sideline, below the trap and toward the basket the offense is attacking, and the safety holds the back court alone. Two attackers on the left side of the floor stand unguarded, which is the trade a zone press makes: it covers the passes rather than the players." class="hd-court-svg">
