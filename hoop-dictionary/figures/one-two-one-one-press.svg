<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393.0 679.0" width="393.0" role="img" aria-label="Full court. The offense is inbounding under the far basket. One defender stands on the inbounder. Two defenders stand across the far free-throw line, one either side. One defender stands near half court in the middle, and one safety waits alone in the back court. The inbound pass goes to a receiver on the right side near the far free-throw line, and the point defender and the right-side defender converge on him at once; the middle defender slides to the sideline outlet and the safety stays home." class="hd-court-svg">
