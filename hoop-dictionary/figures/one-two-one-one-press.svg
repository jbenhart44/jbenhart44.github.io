<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393.0 679.0" width="393.0" role="img" aria-label="Full court, with the offense inbounding under the far basket at the top of the picture. The inbounder, 1, stands out of bounds behind the far baseline, right of the basket, with the ball. The point defender, x1, stands just inside the baseline in front of him, labeled point on the inbounder. x2 and x3 stand across the far free-throw line, one on each side of the lane. x4 stands in the middle just above the half-court line, and x5 waits alone deep in the other half, labeled safety. Of the other attackers, 3 and 2 are near the far free-throw line, 3 on the left and 2 on the right, 4 is in the middle of the floor and 5 is deep on the right. A dashed inbound pass goes from 1 to 2, and x1 and x3 both run at 2, labeled trap the first catch just above and to the right of him. x4 runs toward the right sideline, labeled middle slides to the outlet, and x5 does not move." class="hd-court-svg">
