<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="The ball is at the top. The shooter, 2, starts on the right wing with his defender. Three screeners stand along the baseline, 5 just outside the right block, 4 just right of the rim and 3 just left of it, each with a short bar on his right side, the side the shooter comes from. Their defenders stand above them, and the label above them reads three baseline screens. The shooter runs down from the right wing to the baseline, then along the baseline below all three screeners and under the rim, passing just under the end of each bar, and up to the left wing, where the dashed pass from the top meets him at the label catch. His defender, x2, is still on the right wing, three bodies behind." class="hd-court-svg">
