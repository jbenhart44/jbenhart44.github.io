<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="A 2-3 zone with the ball at the top. x1 and x2 stand high on either side of the free-throw circle, x3 and x4 are the two back corners of the zone, and x5 is in front of the rim. The attacker 4 cuts from the left wing down through the lane toward the right corner, passing below 5 at the high post. The left-back defender, x3, follows him into the lane, his arrow running under the cut, labeled follow him through. Past the lane the right-back defender, x4, drops to pick him up, labeled then he is yours. 2 is on the right wing and 3 in the left corner. The offense sees man-to-man on every cutter and a zone on every pass." class="hd-court-svg">
  <title>Match-up zone: guard the man while he is in your area, then hand him on</title>
