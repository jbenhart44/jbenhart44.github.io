<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="The ball-handler is at the right slot, with his defender below him. The would-be screener sprints up toward the handler's defender as if to set a ball screen, stops short without making contact, and runs out to the arc at the left slot. The handler's defender has stepped to go over a screen that never came, and the screener's defender has stepped up beside the elbow to help on a roll that never comes. The handler dribbles left along the top of the arc and passes to the ghost screener, who is open at the arc. The label beside the end of his run reads ghost: no contact, out to the arc." class="hd-court-svg">
