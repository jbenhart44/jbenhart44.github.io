<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584.0 384.0" width="584.0" role="img" aria-label="A sideline out-of-bounds play. The inbounder 1 stands out of bounds on the right sideline, level with the free-throw line, with the ball, labeled inbounder; his defender stands several feet in front of him, between the two passes. Three attackers stack in a line up the middle of the lane, 2 at the bottom, 3 in the middle and 4 at the top, with their defenders on the ball side; 3's defender plays above him, between him and the inbounder. 5 waits in the far left corner with his defender a few steps off him toward the lane. 2 sets a screen, drawn as a short bar just above him, in the path of 3's defender, then cuts out to the right corner. 3 cuts down past the screen toward the rim, labeled rim cut, so his defender has to get round the screener. 4 pops up to the top of the key, labeled safety. One dashed pass from the inbounder ends just to the right of 3's cut, leading him toward the rim, and a second goes to the safety." class="hd-court-svg">
