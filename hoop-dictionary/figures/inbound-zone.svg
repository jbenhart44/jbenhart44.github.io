  <path d="M 230.0 130.0 A 60.0 60.0 0 0 0 350.0 130.0" stroke="var(--court-line, #3d444d)" fill="none" stroke-width="1.1" stroke-dasharray="5 4"/>
  <path d="M 250.0 267.5 A 40.0 40.0 0 0 1 330.0 267.5" stroke="var(--court-line, #3d444d)" fill="none" stroke-width="1.1"/>
