<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580.0 360.0" width="580.0" role="img" aria-label="A baseline out-of-bounds play against a small zone. The inbounder 1 stands behind the baseline right of the basket with the ball, labeled inbounder. The offense is in a box: 2 on the left block, 3 on the right block, 4 just outside the left elbow and 5 just outside the right elbow. The defense ignores the box and forms a small zone inside the lane: x5 in front of the rim, x3 and x4 flanking him at the edges of the lane, and x1 and x2 at the two elbows. Two cuts are drawn: 2 cuts across toward the front of the rim and stops beside x5, and 3 cuts up the right side of the lane and stops just below x2, so each cutter arrives where a defender already stands. The label guard the spots, not the cutters sits at the top." class="hd-court-svg">
  <title>Zoning the baseline inbound: the defense guards the spots the cuts go to</title>
