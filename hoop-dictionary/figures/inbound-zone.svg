  <line x1="215.5" y1="131.5" x2="240.5" y2="156.5" stroke="var(--hd-defense, #209CAD)" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="215.5" y1="156.5" x2="240.5" y2="131.5" stroke="var(--hd-defense, #209CAD)" stroke-width="2.6" stroke-linecap="round"/>
  <text x="245.0" y="148.5" text-anchor="start" font-size="13.0" fill="var(--hd-defense-ink, #14717F)">x1</text>
