<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552.0 292.0" width="552.0" role="img" aria-label="A baseline out-of-bounds play. The inbounder stands behind the baseline to the right of the basket. The offense is in a box, one attacker on each block and one at each elbow. The defense ignores the box and forms a small zone: one defender in front of the rim, two flanking him at the edge of the lane, two at the elbows. Whichever cutter comes off a screen arrives at a spot that is already guarded." class="hd-court-svg">
