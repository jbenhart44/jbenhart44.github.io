  <text x="290.0" y="63.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="var(--hd-muted, #5b6672)">guard the spots, not the cutters</text>
  <text x="360.0" y="344.0" text-anchor="start" font-size="13.5" font-style="italic" fill="var(--hd-muted, #5b6672)">inbounder</text>
</svg>