<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="The ball is on the right wing. On the weak side, a player stands at the left slot with his defender just below him, on his basket side. The big starts at the left elbow, with his own defender off his shoulder toward the baseline, and steps up behind the slot defender to set a back screen on him, labeled back screen; the screen bar lies between the big's arrow and that defender. The slot player cuts past the screen's inside shoulder to the rim, and the pass comes across from the right wing. This is the core the two glossaries share; one of them treats it as the whole action, the other as one part of a larger set." class="hd-court-svg">
