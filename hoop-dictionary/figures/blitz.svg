<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 366.0" width="516.0" role="img" aria-label="A pick-and-roll from the right slot. The screen bar sits between the handler and the screener, and the handler dribbles left over the top of it. Where his dribble ends, just above the arc, two defenders meet him: the handler's defender, who chased over, on one side and the screener's defender, who jumped out, on the other, labeled two on the ball. The screener short-rolls toward the free-throw line and stops just above it, where he is open, labeled short roll. Behind the trap, the three remaining defenders are spread across four attackers, the roller and the shooters in both corners and on the left wing, and the left-wing defender slides toward the lane; the label three guard four sits under the basket." class="hd-court-svg">
