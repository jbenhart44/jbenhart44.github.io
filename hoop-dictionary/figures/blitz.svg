<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A pick-and-roll from the right slot. As the handler comes off the screen, the screener's defender jumps out and the handler's defender chases over, so two defenders are on the ball at the top of the arc. The screener short-rolls to the free-throw line, where he is open. Behind the trap, the three remaining defenders are spread across four attackers: the roller at the nail and shooters in both corners and the left wing." class="hd-court-svg">
