<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 346.0" width="516.0" role="img" aria-label="A dribble arrow runs from 1 at the top down toward the right side of the rim, and a dashed pass runs from its end out to 3 in the left corner, labeled kick-out. The low man, x3, stands just in front of the rim and a little to its right, where he has come to help on the drive, leaving 3 in the corner. The defender on the left wing, x4, sagging toward the lane and nearer the corner than x3 is, drops down to 3 in the corner, and x3 runs up to 4 on the left wing instead of back to the corner. Their two arrows cross, labeled cross, and each ends in front of the shooter it now guards. x1 stands in the lane at the bottom of the free-throw circle, x5 stands by the rim on the right with 5 in the right dunker spot, and x2 guards 2 in the right corner." class="hd-court-svg">
