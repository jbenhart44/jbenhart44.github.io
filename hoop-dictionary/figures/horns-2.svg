<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="One play from Horns. The guard 1 at the top with the ball dribbles right, off a ball screen from 5, who has stepped up from the right elbow; the screen bar sits between 5 and the guard's defender, and a label just under it reads ball screen. 5 rolls down the lane toward the rim, and his own defender waits in the paint. 4, the big from the left elbow, has stepped out toward the left corner and sets a screen, labeled flare, on the defender of the left-corner shooter 3, who cuts up the sideline to the left wing, labeled shooter lifts. A dashed pass arrow, labeled skip, runs from where the dribble ends on the right side across the floor and ends just short of the wing, ahead of 3. The other shooter 2 stays in the right corner with his defender." class="hd-court-svg">
