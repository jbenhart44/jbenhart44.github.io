<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="One play from Horns. The guard at the top with the ball dribbles right, off a ball screen from the big who has stepped up from the right elbow; a label reads ball screen, and the screen bar sits between that big and the guard's defender. The screener rolls down the lane toward the rim, and his own defender waits in the paint. The big from the left elbow has stepped out toward the left corner and sets a screen, labeled flare, on the defender of the left-corner shooter, who cuts up the sideline to the left wing, labeled shooter lifts. A dashed pass arrow, labeled skip, runs from where the dribble ends on the right side across the floor to that wing. The other shooter stays in the right corner with his defender." class="hd-court-svg">
