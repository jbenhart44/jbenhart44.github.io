<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 346.0" width="516.0" role="img" aria-label="The ball is with the guard at the top of the key, his defender below him. The shooter stands in the lane just in front of the rim, with the rim and backboard showing below him and the label he chooses just to his right. His defender stands beside him to his left, on the baseline side. Two cut arrows leave the shooter, one up to the right wing and one up to the left wing. On the right, a single screener stands inside the right lane line, just above that path, with his screen bar beside him, on the side the shooter comes from, square to the path and stopping just short of it, labeled single just to his right. On the left, two screeners stand in a line just above that path, the first inside the lane and the second just outside the left lane line, each with his screen bar beside him in the same way, on the side the shooter comes from, labeled stagger. Each screener's defender stands above him, toward the ball. A dashed pass arrow runs from the top to each wing." class="hd-court-svg">
