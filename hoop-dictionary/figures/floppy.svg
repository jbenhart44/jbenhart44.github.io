<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="The ball is with the guard at the top of the key, his defender below him. The shooter stands in the lane just in front of the rim, with the rim and backboard showing below him and the label he chooses under the basket. His defender stands beside him to his left, on the baseline side. Two cut arrows leave the shooter, one up to the right wing and one up to the left wing. On the right, a single screener stands inside the right lane line on the paint side of that path, with his screen bar across the path on the side facing the rim, labeled single. On the left, two screeners stand in a line along the paint side of that path, the first inside the lane and the second just outside the left lane line, each with his screen bar across the path, labeled stagger. Each screener's defender stands above him, toward the ball. A dashed pass arrow runs from the top to each wing." class="hd-court-svg">
