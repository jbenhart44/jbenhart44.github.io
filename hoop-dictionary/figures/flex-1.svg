<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="The ball is with a guard at the left slot, and a second guard stands at the right slot. A big stands on the right block with a screen bar at his right side, between him and the defender of a player out on the right side of the lane near the baseline; that defender is on the baseline side of his man. The player cuts across the lane just over the top of the big and the screen bar to the left block, labeled flex cut, and the label cross screen sits just below the big and the screen bar. A dashed pass arrow runs from the guard at the left slot down to the left block. The guard at the right slot cuts down into the lane toward the big. The fifth attacker stands in the left corner. Every attacker has a defender." class="hd-court-svg">
