<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="Half court, defense set. The ball-handler is at the right slot with the ball; his defender is in front of him. The big sets a screen on the handler's defender from the handler's left, angled so the handler can go toward the middle. The handler dribbles off the screen to the middle; the big turns and rolls to the rim. The big's defender has dropped back to the free-throw line to meet the handler. Two shooters are in the corners and a fourth attacker on the weak-side wing." class="hd-court-svg">
