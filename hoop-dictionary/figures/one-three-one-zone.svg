<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="The offense has 1 at the top, 2 on the right wing with the ball, 3 on the left wing, 4 in the right corner and 5 in the left short corner behind the zone. The defense is a 1-3-1: x1 at the point, just inside the arc below 1; x2 and x3 level with the free-throw line out beyond each side of the lane, with x4 between them in the free-throw circle; and x5 in the lane just above the rim, labeled baseline runner. Two teal arrows converge on 2, one from x1 and one from x3, labeled trap the wing. A third teal arrow takes x5 along the baseline across the lane toward 4 in the right corner, to take the corner away." class="hd-court-svg">
