<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A pick-and-roll from the right slot. The screener stands beside the handler's defender, with the screen bar between them, touching neither. The handler dribbles left over the top of the screen. The screener's defender starts on the free-throw line and steps straight up along an arrow that ends just below where the dribble ends; the label big takes the ball sits above the arc, beside the handler. The handler's defender does not chase the ball: his arrow runs down beside the screener's roll toward the rim, labeled guard takes the roll. Three shooters are spaced in the two corners and on the left wing, each with a defender." class="hd-court-svg">
