<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 351.0" width="516.0" role="img" aria-label="Half court. 1 has the ball at the top, with his defender, x1, below him. The shooter, 2, is on the right block. The screener, 5, stands above him just outside the right lane line, with a screen bar below him: the pin-down set for 2. The shooter's defender, x2, stands on the top side of 2, between him and the screen, labeled top-lock. A solid arrow shows the only cut left to 2, backdoor toward the rim, where the big's defender, x5, waits just above the rim; the label under the basket reads backdoor, into the big. 3 on the left wing and 4 in the left corner each have a defender." class="hd-court-svg">
