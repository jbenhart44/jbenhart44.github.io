<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580.0 380.0" width="580.0" role="img" aria-label="A baseline out-of-bounds play. The inbounder 1 stands out of bounds behind the baseline, right of the basket, with the ball, labeled inbounder; his defender is on the court just in front of him. Four attackers form a box: 2 at the left elbow, 3 at the right elbow, 4 on the left block and 5 on the right block. On the left, 4 steps up and sets a screen, drawn as a short bar, just under the defender of 2, and 2 cuts diagonally down the lane to the rim. On the right, 3 comes down the lane line and sets a screen, drawn as a short slanted bar, below and outside the defender of 5, between that defender and the corner. 5 cuts out along the baseline toward the right corner, labeled corner, so his defender has to get round the screen to follow him. The defender of 4 stands low beside the basket and the defender of 3 inside the lane below the right elbow. Two dashed passes leave the inbounder, one to the rim cut and one to the corner. The label first option sits under the basket." class="hd-court-svg">
