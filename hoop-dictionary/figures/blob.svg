<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600.0 400.0" width="600.0" role="img" aria-label="A baseline out-of-bounds play. The inbounder 1 stands out of bounds behind the baseline, right of the basket, with the ball, labeled inbounder; his defender, x1, is on the court in front of him, just inside the right lane line. Four attackers form a box: 2 at the left elbow, 3 at the right elbow, 4 on the left block and 5 on the right block. On the left, 4 steps up and sets a screen, drawn as a short bar, just under x2, the defender of 2, and 2 cuts diagonally down the lane toward the rim. On the right, 3 comes down just outside the right lane line and sets a slanted screen below and outside x5, the defender of 5, between x5 and the corner. 5 cuts out along the baseline toward the right corner, labeled corner, so x5 has to get round the screen to follow him. x4 stands low on the left side of the basket and x3 inside the lane below the right elbow. Two dashed passes leave the inbounder: one to the end of the rim cut, and one toward the right corner, ending just below the end of 5's cut. The label first option sits under the basket." class="hd-court-svg">
