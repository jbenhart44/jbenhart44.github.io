<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 416.0" width="516.0" role="img" aria-label="Early offense up the right side of the floor. The handler, 1, has the ball just outside the arc on the right. The trailing big, 5, runs in from behind the play toward the middle to set a drag screen, drawn as a bar on the middle side of the handler's defender, level with the handler. The handler's defender, x1, has jumped to the high side of the handler, between him and the screen, labeled no middle just above him, so the dribble goes down and to the right, toward the sideline. The screener's defender, x5, who was behind the play on the right, sprints down the right side to get level with the play, labeled sprint level, and his arrow ends on the line of the drive, a few feet ahead of it, so the drive heads straight at him. The label down the sideline sits just past the end of his arrow, toward the sideline. 2 and 3 are in the corners and 4 is on the left wing, each with a defender who got back." class="hd-court-svg">
