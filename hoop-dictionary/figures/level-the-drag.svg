<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 416.0" width="516.0" role="img" aria-label="Early offense up the right side of the floor. The handler dribbles at the arc while the trailing big arrives from behind to set a drag screen angled toward the middle. The screener's defender, who was behind the play, sprints to get level with the screen before it is set. The handler's defender jumps to the high side of the handler, between him and the screen, and forces the dribble down the sideline toward the arriving big instead of into the open middle. The three other attackers are in the corners and the left wing with defenders who got back." class="hd-court-svg">
