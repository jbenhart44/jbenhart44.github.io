<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A 4-out 1-in floor with the one big in the weak-side dunker spot, not the lane. The handler drives the gap between the slot and the wing on the right. The weak-side corner defender must choose: if he helps at the rim the corner is open for a kick-out, if he stays the driver has a layup. The big in the dunker spot is a third option for a drop-off. Dashed passes show both kick-outs." class="hd-court-svg">
