<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A 4-out 1-in floor: 1 has the ball at the right slot, 2 is in the right corner, 3 on the left wing, 4 in the left corner, and the one big, 5, waits in the left dunker spot beside the baseline, not in the lane. 1 dribbles past his defender x1, who is left behind at the slot, and down the right side of the lane to just right of the rim, labeled drive the gap. x5 has stepped into the lane in front of the rim. x4 stands on the left side between the corner and the lane, labeled he has to choose, between the rim and the corner. Two dashed passes leave the end of the drive, one to 4 in the left corner and one to 5 in the dunker spot, and both run below x4 and x5. x2 is with 2 in the right corner and x3 with 3 on the left wing." class="hd-court-svg">
