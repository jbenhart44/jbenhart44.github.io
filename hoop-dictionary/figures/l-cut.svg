<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 351.0" width="516.0" role="img" aria-label="Half court. 1 has the ball at the top, with his defender, x1, below him. 2 starts on the right block with his defender, x2, beside him outside the lane. 2 runs straight up the right lane line to the elbow, labeled up the lane line, then turns flat and cuts out to the right wing, labeled out to the wing. The two legs of the cut make an L. A dashed pass from 1 goes out to the right wing and ends just above where the cut ends. 3 on the left wing, 4 in the left corner and 5 on the left block each have a defender." class="hd-court-svg">
