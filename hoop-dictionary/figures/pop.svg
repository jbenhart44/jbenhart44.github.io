<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="Half court, defense set. The ball-handler, 1, has the ball at the right slot with his defender, x1, below him. The big, 5, stands on x1's left with a screen bar between them, the same screen as the pick-and-roll. 1 dribbles left over the top of the screen toward the middle. Instead of rolling, 5 steps straight up to beyond the arc at the top, labeled pop, and the dashed pass goes from the end of 1's dribble back out to him. The big's defender, x5, has dropped to the free-throw line, labeled drop, so he is guarding the paint while 5 is at the three-point line. 2 and 3 are in the corners and 4 is on the left wing, each with a defender." class="hd-court-svg">
