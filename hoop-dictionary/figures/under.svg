<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A pick-and-roll from the right slot. The screener stands beside the handler's defender, with the screen bar between them, touching neither. The handler dribbles over the top of the screen to a spot just behind the arc, marked pull-up conceded. The handler's defender goes the other way: an arrow takes him beneath the screen, between the screener and the basket, to a corner labeled under, and a second arrow takes him back up on the far side to a spot just below where the handler's dribble ends, so he meets the handler in front of the drive. The screener's defender stays back in the paint. Three shooters are spaced in the two corners and on the left wing, each with a defender." class="hd-court-svg">
