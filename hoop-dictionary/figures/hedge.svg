<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A pick-and-roll from the right slot. The screener stands beside the handler's defender, with the screen bar between them, touching neither. The screener's defender has jumped out above the arc into the handler's path, labeled show, and the handler's short dribble stops at the arc, in front of him. The handler's defender takes a short arrow up past the top of the screen bar, fighting over it to get back in front of the handler. The screener rolls down the lane toward the rim, and the screener's defender runs a long arrow, labeled recover, back down the lane beside the roll. The low man, the defender of the shooter in the left corner, steps into the lane along an arrow labeled tag, toward the end of the roll. The other two attackers stand on the left wing and in the right corner, each with a defender." class="hd-court-svg">
