<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A pick-and-roll from the right slot. The screener stands on the left side of the handler's defender, with the screen bar between them, touching neither, and the handler dribbles left over the top of the screen. The screener rolls down the lane, between the handler's defender and his own defender, who has dropped back just inside the free-throw line. The low man, the defender of the shooter in the left corner, steps into the lane along an arrow labeled tag, which ends a few feet short of the end of the roll arrow. A second arrow, labeled then back, takes him back out toward the corner, so he does not stay with the roller. The other two attackers stand on the left wing and in the right corner, each with a defender." class="hd-court-svg">
