<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 346.0" width="516.0" role="img" aria-label="The ball is with a guard, 1, at the top of the key, his defender just below him. On the right side, the shooter, 2, starts just outside the right block, and his defender stands a step above him on the lane side, between him and the perimeter. Farther up, the big, 5, stands outside the lane between the block and the wing, facing the baseline, with his screen bar on his baseline side, between him and the shooter's defender. The big's own defender stands above him and to his left, at the lane line below the right elbow. The label faces the baseline sits just above the big. The shooter's cut arrow runs up past the outside of the screen to the right wing, labeled catch, and a dashed pass arrow runs from the top toward the same spot. A fourth attacker stands at the left slot and a fifth in the left corner, each with his defender." class="hd-court-svg">
