<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="The ball is with a guard at the top of the key, his defender just below him. On the right side, the shooter starts just outside the right block, and his defender stands a step above him on the lane side, between him and the perimeter. Farther up, a big stands between the lane and the right wing, facing the baseline, with his screen bar on his baseline side, between him and the shooter's defender. The big's own defender stands above him, toward the right elbow. The shooter's cut arrow runs up past the outside of the screen to the right wing, labeled catch, and a dashed pass arrow runs from the top to the right wing. The label faces the baseline sits inside the lane, to the left of the shooter's defender. A fourth attacker stands at the left slot and a fifth in the left corner, each with his defender." class="hd-court-svg">
