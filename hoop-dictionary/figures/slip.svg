<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="The ball-handler 1 is at the right slot. The big, 5, is just below and to the left of him, approaching to set a ball screen. Both defenders have jumped early to the screen: x1 stands just to the handler's left and x5 above and to the left of x1, both upcourt of 5, and each defender's own label sits directly above his X. The words both jumped the screen sit just left of x5. Instead of setting the screen, 5 cuts straight down the lane to the rim, behind both of them, labeled slip, and the handler's dashed pass goes over the top to a spot just beside the end of his cut. 2 and x2 are in the right corner, 3 and x3 in the left corner, and 4 on the left wing with x4 inside him." class="hd-court-svg">
