<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="A side pick-and-roll on the right wing. The screener stands above the handler, on the high side, where the screen would send him toward the middle. The handler's defender has already jumped to the high side, between the handler and the screener, labeled high side, and the screen bar sits between the screener and that defender, touching neither. The handler's dribble goes straight down the sideline toward the baseline, away from the screen, labeled force down. The screener's defender waits below the screen, on the lane side of the drive, level with where the dribble ends, labeled below the screen. No arrow uses the screen. The other three attackers are at the top, on the left wing and in the left corner, each with a defender sagging toward the lane, and the right corner is empty." class="hd-court-svg">
