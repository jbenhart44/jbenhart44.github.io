<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393.0 679.0" width="393.0" role="img" aria-label="Full court. The offense inbounds under the far basket against a press. The inbounder, 1, stands out of bounds behind the far baseline, just left of the basket, with the ball, and one defender, x1, stands on him just inside the line. Two guards stand open to receive, one either side of the lane just below the far free-throw line, with their defenders a step behind them and toward the sidelines, waiting to trap after the catch. One player stands in the middle at half court and one stands deep near the near three-point arc as the safety. Passes are shown from the inbounder to the left guard, labeled inbound, then from that guard to the middle player at half court, labeled the middle is the answer, then ahead to the deep player, labeled safety ahead, each stopping just short of its receiver, so the ball moves up the middle of the floor rather than the sideline." class="hd-court-svg">
