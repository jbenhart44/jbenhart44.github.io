<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="Half court. The ball-handler, 1, has the ball at the right slot with his defender, x1, below him. The big, 5, starts low on the left side of the lane with his defender, x5, above and outside him on the left lane line. A guard, 3, stands above 5 inside the lane and screens x5, drawn as a bar between them, labeled screen for the big under the basket. 5 cuts diagonally up the lane, past that screen, and arrives on x1's left, where a second bar between them is the ball screen, labeled then the ball screen at the top. 1 dribbles left over the top of it toward the middle. x5 is still behind the first screen, so he is late to the second. 3's defender, x3, is on the left wing, and 4 and 2 are in the corners, each with a defender." class="hd-court-svg">
