<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="A switch has left the defense's big, x5, guarding the guard 1 at the left slot; he stands a few steps off 1 toward the lane, labeled switched big. 1 passes across the top to 2 at the right slot, labeled out and back, and steps out to the left, away from the big, staying outside the arc. 2 passes straight back, and the return pass ends just short of where 1's step-out ends. From there 1 dribbles past the big, on the big's left, into the lane toward the rim. The other defenders stay with 2 at the right slot, 3 on the right wing, 4 in the right corner and 5 in the left corner." class="hd-court-svg">
