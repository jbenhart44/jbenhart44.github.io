<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 366.0" width="516.0" role="img" aria-label="The center, 5, stands at the top with the ball, above the arc, and his defender, x5, sags off him into the top of the free-throw circle. The other four attackers stand outside the three-point line, each with a defender inside him: 1 and 3 high on the right and left wings, and 2 and 4 at the top of the right and left corners, just above where the corner line meets the arc. 1 cuts up from the right wing to take a handoff from 5, labeled handoff, and dribbles downhill into the right side of the lane. 4 lifts from the left corner, the corner on the far side from both 1's wing and the drive, up toward the left wing. Nobody stands in the lane, labeled empty paint." class="hd-court-svg">
