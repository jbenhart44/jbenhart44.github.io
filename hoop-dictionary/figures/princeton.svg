<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A 5-out floor with the big at the high post. The ball goes from the top to the big at the free-throw line. The passer's defender denies the return, so the passer back cuts to the rim and the high post can drop it to him. If the back cut is covered, the passer clears to the corner and the next guard cuts off the high post for a handoff. The other three are spaced at the wings and the far corner." class="hd-court-svg">
