<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A 5-out floor with the big, 5, at the high post, labeled high post. 1 has the ball above the right elbow, outside the arc; 2 is at the right wing, 3 at the left wing and 4 in the left corner, each with his defender, and the right corner is empty. A dashed pass goes from 1 to 5. 1's defender, x1, has stepped to his left, onto the high side of the passing lane from 5 back to him, labeled denied. 1 back cuts behind him, straight down the other side to the rim, labeled back cut, and a dashed pass from 5 drops toward the end of that cut; x5 is in the lane below 5. From the end of the back cut, a second arrow takes 1 out along the baseline to the empty right corner, labeled clears. 2 cuts from the right wing across toward 5 at the high post, labeled handoff." class="hd-court-svg">
