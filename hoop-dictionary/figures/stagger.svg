<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="The ball is with a guard on the right wing, his defender inside him. The shooter starts in the left corner, his defender beside him toward the lane. Two screeners stand in a line just to the lane side of the shooter's path, between the corner and the left slot, the second about seven feet above the first. Each has his screen bar across the path on the side facing back toward the corner, and each screener's defender stands beside him toward the lane. The labels first and second sit beside the path opposite the two screeners. The shooter's cut arrow runs up past both screens to the left slot, labeled catch, and a dashed pass arrow runs from the right wing to the same spot. A fifth attacker stands in the right corner with his defender." class="hd-court-svg">
