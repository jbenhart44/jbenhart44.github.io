<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="Five attackers spaced around the arc with the ball on the right wing. The on-ball defender is in front of the ball. The right-corner defender is a step off his man toward the ball. The defender on the top player is in the gap, a step toward the lane. The two weak-side defenders have left their men: one stands at the nail, the middle of the free-throw line, and the low man stands in the lane near the rim with one foot in the paint. The strong side is guarded man to man; the help side is guarded from the middle." class="hd-court-svg">
