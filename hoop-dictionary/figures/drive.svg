<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="The ball-handler 1 at the right slot dribbles down into the gap toward the middle of the lane, labeled into the gap; his defender, x1, is off to his right, out of the path of the dribble. The top, the spot between 1 and 3 at the left slot, is empty. Two help defenders react, each drawn with an arrow: x3, the defender of 3, stands at the nail and steps across in front of the drive, labeled steps across; x4, the defender of 4 in the left corner, sinks from the left side toward the lane and the rim, labeled sinks. 3 at the left slot and 4 in the left corner are left unguarded. 5 stands in the left dunker spot with x5 between him and the rim, and 2 is in the right corner with x2 above him." class="hd-court-svg">
