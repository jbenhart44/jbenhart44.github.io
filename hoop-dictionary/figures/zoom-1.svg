<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 346.0" width="516.0" role="img" aria-label="The shooter starts in the right corner with his defender just inside him. A big stands above that defender and sets a pin-down on him: the screen bar, labeled pin-down, lies between the big and the defender. The shooter runs straight up past the sideline end of the screen toward the right wing. The ball-handler dribbles from the top of the key toward the same spot at the right wing, with his defender below him. The big's defender stands off him toward the lane. Two more attackers wait on the left wing and in the left corner, each with a defender." class="hd-court-svg">
