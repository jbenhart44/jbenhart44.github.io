<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640.0 316.0" width="640.0" role="img" aria-label="A timeline of the five eras this chapter uses, each drawn as a band from its start year to its end year: Origins from 1891 to 1946, the founding league from 1946 to 1954, the shot-clock game from 1954 to 1979, the three-point line from 1979 to 2001, and the paint opens from 2001 to the present. Each boundary is a dated rule change or the first season of a league, not a change of style." class="hd-chart-svg">
<title>The five eras</title>
<rect x="0" y="0" width="640.0" height="316.0" fill="var(--court-floor, #fdfdfd)"/>
<rect x="16.0" y="46.0" width="247.7" height="20" rx="3" fill="var(--hd-offense, #C97400)" fill-opacity="0.22" stroke="var(--hd-offense, #C97400)" stroke-width="1.4"/>
<text x="16.0" y="41.0" text-anchor="start" font-size="12" font-weight="600" fill="var(--hd-ink, #22272e)">Origins</text>
<text x="16.0" y="78.0" text-anchor="start" font-size="10.5" fill="var(--hd-muted, #5b6672)">1891 to 1946  invention to the BAA's first season</text>
<rect x="263.7" y="98.0" width="36.03" height="20" rx="3" fill="var(--hd-defense, #209CAD)" fill-opacity="0.22" stroke="var(--hd-defense, #209CAD)" stroke-width="1.4"/>
<text x="263.7" y="93.0" text-anchor="start" font-size="12" font-weight="600" fill="var(--hd-ink, #22272e)">The founding league</text>
<text x="263.7" y="130.0" text-anchor="start" font-size="10.5" fill="var(--hd-muted, #5b6672)">1946 to 1954  BAA and NBA, before the clock</text>
<rect x="299.73" y="150.0" width="112.59" height="20" rx="3" fill="var(--hd-muted, #5b6672)" fill-opacity="0.22" stroke="var(--hd-muted, #5b6672)" stroke-width="1.4"/>
<text x="299.73" y="145.0" text-anchor="start" font-size="12" font-weight="600" fill="var(--hd-ink, #22272e)">The shot-clock game</text>
<text x="299.73" y="182.0" text-anchor="start" font-size="10.5" fill="var(--hd-muted, #5b6672)">1954 to 1979  24 seconds, no arc</text>
<rect x="412.33" y="202.0" width="99.08" height="20" rx="3" fill="var(--hd-offense, #C97400)" fill-opacity="0.22" stroke="var(--hd-offense, #C97400)" stroke-width="1.4"/>
<text x="412.33" y="197.0" text-anchor="start" font-size="12" font-weight="600" fill="var(--hd-ink, #22272e)">The three-point line</text>
<text x="511.41" y="234.0" text-anchor="end" font-size="10.5" fill="var(--hd-muted, #5b6672)">1979 to 2001  the line exists, mostly unused</text>
<path d="M 624.0 254.0 L 511.41 254.0 L 511.41 274.0 L 624.0 274.0" fill="var(--hd-defense, #209CAD)" fill-opacity="0.22" stroke="var(--hd-defense, #209CAD)" stroke-width="1.4"/>
<line x1="624.0" y1="254.0" x2="624.0" y2="274.0" stroke="var(--hd-defense, #209CAD)" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="511.41" y="249.0" text-anchor="start" font-size="12" font-weight="600" fill="var(--hd-ink, #22272e)">The paint opens</text>
<text x="624.0" y="286.0" text-anchor="end" font-size="10.5" fill="var(--hd-muted, #5b6672)">2001 to present  illegal defense removed; era current, no end boundary on file</text>
<line x1="16.0" y1="20" x2="624.0" y2="20" stroke="var(--hd-rule, #d7dce2)" stroke-width="1"/>
<text x="16.0" y="14" text-anchor="middle" font-size="10.5" fill="var(--hd-muted, #5b6672)">1891</text>
<text x="146.61" y="14" text-anchor="middle" font-size="10.5" fill="var(--hd-muted, #5b6672)">1920</text>
<text x="263.7" y="14" text-anchor="middle" font-size="10.5" fill="var(--hd-muted, #5b6672)">1946</text>
<text x="299.73" y="14" text-anchor="middle" font-size="10.5" fill="var(--hd-muted, #5b6672)">1954</text>
<text x="412.33" y="14" text-anchor="middle" font-size="10.5" fill="var(--hd-muted, #5b6672)">1979</text>
<text x="511.41" y="14" text-anchor="middle" font-size="10.5" fill="var(--hd-muted, #5b6672)">2001</text>
<text x="624.0" y="14" text-anchor="middle" font-size="10.5" fill="var(--hd-muted, #5b6672)">2026</text>
</svg>
