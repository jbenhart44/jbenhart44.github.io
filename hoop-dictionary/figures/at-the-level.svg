<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A pick-and-roll from the right slot. The screener stands just below and left of the screen bar, beside the handler's defender, with the bar between them, touching neither. The screener's defender stands a few feet to the left of the screener, level with the screen and a little on its basket side, below the handler's route, labeled at the level. The handler dribbles left over the top of the screen, and his dribble points straight at that defender and stops a couple of feet short of him, so the handler runs into him as he comes off the screen. The screener rolls down the lane toward the rim, behind the big. The handler's defender stays on his own side of the screen, with no arrow. Three shooters are spaced in the two corners and on the left wing, each with a defender." class="hd-court-svg">
