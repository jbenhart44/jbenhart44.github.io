<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 351.0" width="516.0" role="img" aria-label="Half court. 1 has the ball at the top, with his defender, x1, just below him and to his left. 2 is on the right wing. His defender, x2, stands above him and toward the ball, in the passing lane, labeled denying the wing. 2 cuts straight to the rim behind x2, a solid arrow labeled back door that ends at the right edge of the restricted arc. A dashed pass from 1 runs down the lane and stops just above the end of the cut, leading him to the rim. 3 on the left wing, 4 in the left corner and 5 at the left dunker spot each have a defender on the basket side of him." class="hd-court-svg">
