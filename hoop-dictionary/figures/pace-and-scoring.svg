<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640.0 300.0" width="640.0" role="img" aria-label="A line chart with two series across NBA regular seasons from 1979-80 to 2024-25, on a vertical axis that starts at 80 rather than 0 so the movement is visible. Pace, possessions per game, starts at 103.1 in 1979-80, falls through the 1990s to its low of 88.9 in 1998-99, and rises again to 98.8 by 2024-25 without returning to where it began. Points per game falls with it to 91.6 in the same season, then rises much further, ending at 113.8, well above its 1979-80 value of 109.3, while pace is still below its own. The gap between the two lines is the difference the site calls efficiency." class="hd-chart-svg">
