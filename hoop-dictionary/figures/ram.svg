<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="Half court. 1 has the ball at the top, with his defender, x1, below him. The big, 5, starts at the right block, with his defender, x5, above him on the lane side. A solid arrow from the right wing ends at 4, who stands in the lane above x5 and sets a pin-down on him, drawn as a bar between them. 4's defender, x4, trails outside the right lane line, above 4's path. 5 sprints up the lane, past the pin-down, to the right of x1, where a second bar between them is the ball screen. 1 dribbles right, off that screen, and 5 rolls from it down the lane toward the rim. x5, still below the pin-down, is labeled late. The label just left of the pin-down bar reads pin-down for the screener. 2 and 3 are in the corners, each with a defender." class="hd-court-svg">
