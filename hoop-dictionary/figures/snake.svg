<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="Half court. The handler, 1, has the ball at the right slot with his defender, x1, just below him. The screener, 5, stands on x1's left with a screen bar between them. 1 dribbles left over the top of the screen toward the middle, then snakes back down and to the right past the screener's left side, ending in the lane just below the right end of the free-throw line, labeled snake back, with x1 left upcourt behind him. x5 has dropped below the free-throw line, labeled drop, and stands between the handler and the rim. 5 rolls down the left side of the lane toward the basket, crossing the handler's path. 2 and 3 are in the corners and 4 is on the left wing, each with a defender." class="hd-court-svg">
