<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 346.0" width="516.0" role="img" aria-label="A box set after a timeout. 1 has the ball at the top of the key, with his defender a step below him and to the left. Four attackers form the box: 2 at the left elbow, 4 at the right elbow, 3 on the left block and 5 on the right block. The defender of 2 is below him on the left lane line, the defender of 3 is above his man, the defender of 4 is below him toward the middle, and the defender of 5 is above his man, just outside the lane. 2 runs across the lane and down to set a screen, drawn as an upright bar, just inside the defender of 5. 5 cuts along the baseline toward the rim, and a dashed pass from 1 comes down to meet him in front of the rim, above the label first option. From just above the screen a second arrow carries 2 up and out toward the right wing, over the defender of 5, labeled screener pops. Only the first option has a pass drawn." class="hd-court-svg">
