<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="A box set after a timeout. The ball-handler 1 stands at the top of the key with the ball; his defender is a step below him and off to the left in the picture. Four attackers form the box: 2 at the left elbow, 4 at the right elbow, 3 on the left block and 5 on the right block. The defender of 2 is below him on the left lane line, the defender of 3 above his man, the defender of 4 below him and toward the middle, and the defender of 5 above his man and just outside him. 2 runs across the lane and down, and sets a screen, drawn as an upright bar, on the inside of the defender of 5, between that defender and the rim. 5 cuts along the baseline toward the rim, passing under the screen, so his defender has to get round the screener to follow; a dashed pass from 1 comes down to meet him there, above the label first option under the basket. From the screen a second arrow carries 2 up and out toward the right wing, over the top of 5's defender, labeled screener pops. Only the first option has a pass drawn." class="hd-court-svg">
