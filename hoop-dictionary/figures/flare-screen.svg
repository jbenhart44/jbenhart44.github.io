<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 346.0" width="516.0" role="img" aria-label="The ball is at the right wing with 1, whose defender is below him and toward the middle. A shooter, 2, is at the top of the key. His defender, x2, is below him and a step toward the ball, labeled cheating to the ball. A big, 4, stands on x2's other side, away from the ball, with a bar between them: the screen. 2 fades away from the ball, just outside the arc and along it, to the left wing, labeled fade, and the dashed skip pass goes across the floor from the right wing to the spot just below where he arrives. 4's defender, x4, is on 4's left and a little below him, under 2's fade. 3 is in the left corner and 5 is low on the right, each with a defender." class="hd-court-svg">
