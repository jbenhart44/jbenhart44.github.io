<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 416.0" width="516.0" role="img" aria-label="The ball-handler starts high on the right side and dribbles left toward the middle, passing above two screens set in a staggered line. The first big stands just inside the arc beside the handler's defender, on the middle side, with a screen bar between them; the second big stands a step further along the handler's path with his own screen bar facing the first. The first screener pops out to the arc at the right wing, labeled pop; the second rolls down the middle to the rim, labeled roll. The first screener's defender is still far behind the play, above the arc, and the second screener's defender waits just above the free-throw line. Two shooters wait in the corners, each with a defender." class="hd-court-svg">
