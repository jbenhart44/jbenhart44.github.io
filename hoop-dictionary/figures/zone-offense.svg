<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A 2-3 zone, drawn as five defenders in two rows: two at the top and three across the lane. The offense has four attackers on the right side (an overload) and one at the top; a big flashes into the free-throw line gap in the middle of the zone. Two passes are shown: the entry to the flashing big in the middle, and the skip pass across the top to the far wing where the zone is thinnest." class="hd-court-svg">
  <title>Zone offense: overload one side, flash the middle, skip to the other</title>
