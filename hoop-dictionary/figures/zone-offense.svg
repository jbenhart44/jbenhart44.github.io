<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 356.0" width="516.0" role="img" aria-label="A 2-3 zone, labeled 2-3 zone: two defenders up top, x2 out on the ball and x1 near the left elbow, and three across the back, x3, x4 and x5. Four attackers overload the right side: 1 with the ball at the right slot, 2 on the right wing, 3 in the right corner and 5 on the right block. One attacker, 4, is alone on the left wing. 5 flashes from the block up into the gap just below the free-throw line, labeled flash the gap, and 1's entry pass goes to him there. A second pass, the skip, goes from 1 across the top of the key to 4 on the weak side, labeled skip to the weak side." class="hd-court-svg">
  <title>Zone offense: overload one side, flash the middle, skip to the other</title>
