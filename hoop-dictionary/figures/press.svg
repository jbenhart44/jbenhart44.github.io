<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393.0 679.0" width="393.0" role="img" aria-label="Full court, with the offense inbounding at the far end, drawn at the top. The inbounder, 1, stands out of bounds behind the far baseline and throws a dashed pass to 2 on the left side, inside the far three-point arc. 2 dribbles up the left side toward half court and stops a few feet from the sideline, about eight feet past the far arc. Two defenders stand at the front line, one at each side of the far lane just inside the far free-throw line, labeled front line. The left one, x1, runs down toward the end of the dribble. Two more stand back, below the far arc. The left one, x3, runs up toward the end of the dribble from the half court side, so the two arrows close on the handler from both sides, labeled trap on the sideline. 3 stands on the right side inside the far arc and 4 in the middle just below it. The safety, x5, stands alone a few feet past half court, labeled safety, and 5 is behind him, just above the other three-point arc." class="hd-court-svg">
