<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393.0 679.0" width="393.0" role="img" aria-label="Full court. The offense is inbounding under its own basket at the far end. Two defenders stand at the front line inside the far free-throw line, two more stand back near the far three-point arc, and one safety stands alone in the back court near half court. The inbound pass is conceded rather than contested: it goes to a guard on the left side, who dribbles up the sideline, and only then do the front-line defender on that side and the second-line defender behind him converge to trap him against the sideline. Every attacker who is not in the trap is a pass away from a basket the safety is guarding by himself." class="hd-court-svg">
  <title>The 2-2-1 press: two at the front line, two behind, one safety, and the trap on the sideline after the dribble starts</title>
