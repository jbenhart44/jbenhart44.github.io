<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516.0 336.0" width="516.0" role="img" aria-label="Two attackers stand on each block, one directly above the other: 3 above 2 on the left, 5 above 4 on the right. The ball-handler 1 is at the top of the key with the ball and his defender just below him. The four other defenders crowd the two stacks: the defenders of the lower players stand low and inside, between them and the basket, and the defenders of the upper players stand just outside them. The left stack splits: 3 cuts up and out toward the left wing, and 2 cuts out toward the left corner. The label they split or screen sits in the lane between the stacks." class="hd-court-svg">
