# Pull the scores on a schedule, from OUTSIDE Cloudflare.
#
# WHY THIS EXISTS. Cloudflare's own Cron Trigger for `ballknowers-scores` is registered - its
# API confirms the five-minute schedule - and it has never fired once. Verified 2026-09-08: no
# heartbeat in 25 minutes, `wrangler tail` connected and saw ZERO invocations, and a manual
# POST to /refresh did the same work in 0.37 seconds. So the Worker is fine and the scheduler
# is not, and the fix is a scheduler that does run.
#
# THIS REPO is where it lives, chosen because it is public (so Actions minutes are
# unlimited) and active. The workflow exposes only the Worker's URL, which already
# answers /health publicly. The secret is a repository secret and is not in this file.
# WHAT IT NEEDS: one repository secret named REFRESH_TOKEN, holding the Worker's /refresh
# secret. Copy it to your clipboard without it ever being displayed:
#
#     security find-generic-password -s ballknowers-refresh -w | tr -d '\n' | pbcopy
#
# then paste it into Settings -> Secrets and variables -> Actions -> New repository secret.
#
# THE SCHEDULE IS GAME WINDOWS ONLY, in UTC, which is what keeps this inside the free Actions
# allowance for a private repo (~312 runs a week at a few seconds each, against 2,000 minutes a
# month). Cloudflare's side already ignores a tick with no game near it, so an extra run costs
# nothing but a request.
#
# GitHub's scheduled runs are best-effort and can be late by several minutes. That is fine here:
# a score that lands 10 minutes after a game ends is still a live leaderboard. It also means
# this is a floor, not a guarantee - which is why /health reports a heartbeat you can check.
#
# NOTE: GitHub disables scheduled workflows in a repo with no activity for 60 days. If the pool
# goes quiet in the off-season that is fine; re-enable it in the Actions tab next season.

name: refresh scores

on:
  schedule:
    - cron: "*/5 16-23 * * 0"    # Sunday 12:00-19:59 ET, the main slate
    - cron: "*/5 0-5 * * 1"      # Sunday night into Monday, ET
    - cron: "*/5 23 * * 1,4"     # Monday and Thursday 19:00 ET, pre-kickoff
    - cron: "*/5 0-4 * * 2,5"    # Monday and Thursday night games, ET
  workflow_dispatch:              # and a button, for testing

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      WORKER: https://ballknowers-scores.benhart-family.workers.dev
      TOKEN: ${{ secrets.REFRESH_TOKEN }}
    steps:
      - name: Check the secret is present
        run: |
          if [ -z "$TOKEN" ]; then
            echo "REFRESH_TOKEN is not set on this repository. Nothing was called."
            exit 1
          fi

      # THE WORKER DECIDES WHICH WEEK, not this file. It owns the schedule and the game-window
      # rule; duplicating that here would be a second place to be wrong about it.
      - name: Which week is being played?
        id: wk
        run: |
          curl -sS -o health.json "$WORKER/health"
          week=$(python3 -c "import json;print(json.load(open('health.json')).get('weekInPlay') or '')")
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "week in play: ${week:-none}"

      # No football on: just record that the schedule ran. The Worker's idle path makes no
      # outbound request, so this costs nothing.
      - name: Heartbeat only
        if: steps.wk.outputs.week == ''
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" "$WORKER/refresh")
          echo "HTTP $code"; cat body.json; test "$code" = "200"

      # Football on: FETCH HERE and push the payload. ESPN answers a GitHub runner (200) and
      # refuses a Cloudflare Worker (403) whatever headers it sends - measured 2026-09-08
      # against the deployed Worker. The Worker still does the parsing, so there is one parser.
      - name: Fetch the scoreboard and push it
        if: steps.wk.outputs.week != ''
        run: |
          week="${{ steps.wk.outputs.week }}"
          code=$(curl -sS -o espn.json -w '%{http_code}' \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&seasontype=2&week=$week")
          echo "ESPN HTTP $code for week $week"
          test "$code" = "200"
          echo "events: $(python3 -c 'import json;print(len(json.load(open("espn.json"))["events"]))')"
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-binary @espn.json "$WORKER/ingest?week=$week")
          echo "ingest HTTP $code"; cat body.json; test "$code" = "200"
